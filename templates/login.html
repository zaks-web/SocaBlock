{% extends "base.html" %}{% block title %}Connexion · SocaBlock{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
  <div class="eyebrow">BON RETOUR</div><h1>Connexion</h1><p class="muted">Accédez à votre espace SocaBlock.</p>
  <form method="post" class="form">
    <label>Adresse e-mail<input type="email" name="email" required autocomplete="email"></label>
    <label>Mot de passe<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn primary full">Se connecter</button>
  </form><p class="muted center">Nouveau sur SocaBlock ? <a href="{{ url_for('register') }}">Créer un compte</a></p>
</div></div>
{% endblock %}
